apiVersion: unleash.nais.io/v1
kind: ApiToken
metadata:
  name: "{{name}}"
  namespace: teamdagpenger
  labels:
    team: "teamdagpenger"
    app: "{{name}}"
    subteam: "ramp"
spec:
  unleashInstance:
    apiVersion: unleash.nais.io/v1
    kind: RemoteUnleash
    name: teamdagpenger
  secretName: "{{name}}-unleash-api-token"

  environment: "{{unleash.environment}}"
